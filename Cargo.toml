[package]
name = "nier-automata-unburger"
version = "0.2.2"
edition = "2021"

[dependencies]
gtk4 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
walkdir = "2"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
sha2 = "0.10"
